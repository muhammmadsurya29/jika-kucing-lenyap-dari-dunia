name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Mengizinkan aksi ini untuk melakukan push ke cabang gh-pages
permissions:
  contents: write

jobs:
  export-web:
    name: Export to Web and Deploy
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.7.stable ~/.local/share/godot/export_templates/4.7.stable
          
      - name: Remove Windows Preset to avoid path errors
        run: |
          sed -i '/\[preset.1\]/,/^$/d' export_presets.cfg || true

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
