name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Mengizinkan aksi ini untuk melakukan push ke cabang gh-pages
permissions:
  contents: write

jobs:
  export-and-deploy:
    name: Export to Web and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download and Install Godot
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip Godot_v4.3-stable_linux.x86_64.zip
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/
          
      - name: Export Web
        run: |
          mkdir -p build/web
          # Import assets first (will exit automatically or crash if normal, so we catch it)
          ./Godot_v4.3-stable_linux.x86_64 --headless --editor --quit || true
          # Export to web
          ./Godot_v4.3-stable_linux.x86_64 --headless --export-release "Web" build/web/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
